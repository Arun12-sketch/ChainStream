name: ChainStream CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-tests:
    name: Rust Indexer & Reorg Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --workspace

      - name: Run Rust Tests
        run: cargo test --workspace

  go-tests:
    name: Go API & Reorg Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api-go/go.sum

      - name: Run Go Unit Tests
        run: |
          cd services/api-go
          go test -v -race ./...

      - name: Run Reorg Tests
        run: |
          cd tests
          go test -v ./...

  frontend-build:
    name: Next.js Control Center Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/dashboard/package.json

      - name: Install Frontend Dependencies
        run: |
          cd services/dashboard
          npm install

      - name: Build Next.js Production Bundle
        run: |
          cd services/dashboard
          npm run build

  e2e-verification:
    name: End-to-End Pipeline Verification
    needs: [rust-tests, go-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Integration Script
        run: |
          chmod +x tests/integration/e2e_pipeline_test.sh
          ./tests/integration/e2e_pipeline_test.sh
