apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainstream-api
  namespace: chainstream
  labels:
    app: chainstream-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chainstream-api
  template:
    metadata:
      labels:
        app: chainstream-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chainstream-api-sa
      containers:
        - name: api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/chainstream/api-go:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chainstream-config
            - secretRef:
                name: chainstream-secrets
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chainstream-api
  namespace: chainstream
spec:
  type: ClusterIP
  selector:
    app: chainstream-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
