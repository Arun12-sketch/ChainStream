apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainstream-indexer
  namespace: chainstream
  labels:
    app: chainstream-indexer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chainstream-indexer
  template:
    metadata:
      labels:
        app: chainstream-indexer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chainstream-indexer-sa
      containers:
        - name: indexer
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/chainstream/indexer-rust:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chainstream-config
            - secretRef:
                name: chainstream-secrets
          ports:
            - containerPort: 9090
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chainstream-indexer
  namespace: chainstream
spec:
  selector:
    app: chainstream-indexer
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
